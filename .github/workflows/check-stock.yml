# Put this file at .github/workflows/check-stock.yml in your repo
name: iPhone Duo stock check

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may delay runs a bit)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests telethon

      # Keep state.json between runs so you only get alerted on changes
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: stock-state-

      - name: Check stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          ZIP_CODES: ${{ vars.ZIP_CODES || '10001,94103,60601' }}
          PART_NUMBERS: ${{ vars.PART_NUMBERS }}
        run: python bot.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
